<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShinyButton Reference</title>
<style>
  @property --gradient-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  @property --gradient-angle-offset {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  @property --gradient-percent {
    syntax: "<percentage>";
    initial-value: 5%;
    inherits: false;
  }

  @property --gradient-shine {
    syntax: "<color>";
    initial-value: #ffffff;
    inherits: false;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* === ShinyButton === */
  .shiny-button {
    --gradient-angle: 0deg;
    --gradient-angle-offset: 0deg;
    --gradient-percent: 5%;
    --gradient-shine: #ffffff;

    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 300px;
    padding: 16px 32px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.02em;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 360px;
    background:
      linear-gradient(black, black) padding-box,
      conic-gradient(
        from calc(var(--gradient-angle) + var(--gradient-angle-offset)),
        transparent,
        blue var(--gradient-percent),
        var(--gradient-shine) calc(var(--gradient-percent) * 2),
        blue calc(var(--gradient-percent) * 3),
        transparent calc(var(--gradient-percent) * 4)
      ) border-box;
    outline: none;
    overflow: hidden;
    animation: rotate-gradient 3s linear infinite;
    transition:
      --gradient-percent 0.5s ease,
      --gradient-angle-offset 0.5s ease,
      --gradient-shine 0.5s ease;
  }

  /* Dot pattern overlay */
  .shiny-button::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-image: radial-gradient(
      rgba(255, 255, 255, 0.15) 1px,
      transparent 1px
    );
    background-size: 4px 4px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.6;
  }

  /* Inner shimmer */
  .shiny-button::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      ellipse at 50% 0%,
      rgba(100, 100, 255, 0.15) 0%,
      transparent 60%
    );
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* Button text wrapper */
  .shiny-button span {
    position: relative;
    z-index: 2;
  }

  /* Breathing glow on hover (via span::before) */
  .shiny-button span::before {
    content: "";
    position: absolute;
    inset: -20px -40px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at center,
      rgba(100, 100, 255, 0.3) 0%,
      transparent 70%
    );
    opacity: 0;
    z-index: -1;
    transition: opacity 0.5s ease;
    animation: none;
  }

  /* Hover states */
  .shiny-button:hover {
    --gradient-percent: 20%;
    --gradient-angle-offset: 95deg;
    --gradient-shine: #8484ff;
  }

  .shiny-button:hover::after {
    opacity: 1;
  }

  .shiny-button:hover span::before {
    opacity: 1;
    animation: breathe-glow 2s ease-in-out infinite;
  }

  /* Gradient rotation keyframes */
  @keyframes rotate-gradient {
    0% {
      --gradient-angle: 0deg;
    }
    100% {
      --gradient-angle: 360deg;
    }
  }

  /* Breathing glow keyframes */
  @keyframes breathe-glow {
    0%, 100% {
      opacity: 0.4;
      transform: scale(1);
    }
    50% {
      opacity: 1;
      transform: scale(1.15);
    }
  }
</style>
</head>
<body>
  <button class="shiny-button" type="button">
    <span>Unlock</span>
  </button>
</body>
</html>
